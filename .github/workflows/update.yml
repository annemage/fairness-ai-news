name: Update papers

on:
  schedule:
    - cron: "0 5 * * *"   # every day at 05:00 UTC (07:00 in Central European summer time)
  workflow_dispatch:      # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: update-papers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Fetch papers and write blurbs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.MODEL }}
          MAX_PAPERS: ${{ vars.MAX_PAPERS }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: python scripts/update.py
      - name: Commit if changed
        run: |
          git config user.name "fairness-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/papers.json data/seen.json
          git diff --cached --quiet || git commit -m "Update papers $(date -u +%F)"
          git push
